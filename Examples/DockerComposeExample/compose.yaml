services:
  bouncy_hsm_server:
    image: "ghcr.io/harrison314/bouncyhsm:latest"
    ports:
      - "8080:8080"
      - "8765:8765"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 10
  test_service:
    build: TestContainer
    environment:
      BOUNCY_HSM_CFG_STRING: "Server=bouncy_hsm_server; Port=8765;"
      BOUNCY_HSM_HTTP: "http://bouncy_hsm_server:8080/"
    depends_on:
      - bouncy_hsm_server